version: 2

updates:
  # Runtime dependencies are few (three) and each one is load-bearing, so they
  # get their own PRs rather than being batched into a noisy group.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Dev tooling churns constantly and is not shipped to consumers, so patch
      # and minor bumps land as a single PR. Majors stay separate - they tend
      # to need config changes (the vitest 3 -> 4 bump did).
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 is blocked by the plugin ecosystem, not by this repo:
      # eslint-plugin-jsx-a11y and eslint-plugin-react both still cap their
      # peer range at eslint 9 in their latest releases. Revisit when they
      # ship eslint 10 support; until then the PR can only ever fail.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # typescript 7 is blocked by the lint toolchain, not by this repo:
      # typescript-eslint caps its peer range at `typescript >=4.8.4 <6.1.0`
      # as of 8.67.0, and there is no v9, so the install can only ERESOLVE.
      # Revisit when typescript-eslint ships TypeScript 7 support.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # react/react-dom are devDependencies here only so the tests can run.
      # The supported range is declared in peerDependencies, and widening it
      # is a deliberate decision - see AGENTS.md on why React 18 is the floor.
      # A new React major should be adopted intentionally, not by bot PR.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]

  # Pinned action versions go stale silently and are a supply-chain surface.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
