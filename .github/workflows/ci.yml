name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck published declarations
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The published package must install cleanly for consumers on every
  # supported React major, which is exactly what 0.x could not do.
  peer-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: ["18", "19"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm pack

      - name: Install the tarball against React ${{ matrix.react-version }}
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/react-hig-datepicker-*.tgz \
            react@${{ matrix.react-version }} \
            react-dom@${{ matrix.react-version }}
          node -e "const m=require('react-hig-datepicker'); if(!m.default) throw new Error('missing default export')"
          node --input-type=module -e "import d from 'react-hig-datepicker'; if(!d) throw new Error('missing ESM export')"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
