name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm run check:package

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Keeps the README images honest. Deliberately does NOT diff the committed
  # PNGs against freshly captured ones: font rasterisation differs between
  # macOS (where they are generated) and Linux, so a byte comparison would fail
  # on every run regardless of whether anything actually changed.
  docs-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Run before regenerating anything, while the tree still matches the commit.
      - name: Flag stylesheet changes that skipped the screenshots
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit to diff against; skipping."
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED" | sed 's/^/  /'

          if ! echo "$CHANGED" | grep -q '^src/styles/'; then
            echo "Stylesheet untouched; nothing to check."
            exit 0
          fi
          if echo "$CHANGED" | grep -q '^docs/images/'; then
            echo "Stylesheet and images both updated."
            exit 0
          fi
          # Escape hatch for style edits with no visual effect (renames, comments).
          if git log --format=%B "$BASE"..HEAD | grep -qF '[skip-images]'; then
            echo "Opted out via [skip-images]."
            exit 0
          fi

          echo "::error::src/styles changed but docs/images did not. The README"                "screenshots may now misrepresent the component. Run"                "'npm run screenshots' (and 'npm run demo:gif' if the animation is"                "affected) and commit the result, or add [skip-images] to the commit"                "message if the change has no visual effect."
          exit 1

      - run: npx playwright install --with-deps chromium

      # Proves the capture script still works and that no two shots came out
      # identical - the guard that caught a "focus" image which was a copy of
      # the unfocused one.
      - name: Screenshot generator still produces distinct images
        run: npm run screenshots

  # The published package must install cleanly for consumers on every
  # supported React major, which is exactly what 0.x could not do.
  peer-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: ["18", "19"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm pack

      - name: Install the tarball against React ${{ matrix.react-version }}
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/react-hig-datepicker-*.tgz \
            react@${{ matrix.react-version }} \
            react-dom@${{ matrix.react-version }}
          node -e "const m=require('react-hig-datepicker'); if(!m.default) throw new Error('missing default export')"
          node --input-type=module -e "import d from 'react-hig-datepicker'; if(!d) throw new Error('missing ESM export')"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
